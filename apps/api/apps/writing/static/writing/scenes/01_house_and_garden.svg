<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="black" stroke-width="4">
<rect x="0" y="0" width="800" height="600" fill="white" stroke="none"/>
<!-- ground -->
<line x1="0" y1="480" x2="800" y2="480"/>
<!-- house body -->
<rect x="220" y="260" width="260" height="220"/>
<!-- roof -->
<polygon points="200,260 350,140 500,260"/>
<!-- chimney -->
<rect x="420" y="170" width="30" height="60"/>
<!-- door -->
<rect x="320" y="380" width="60" height="100"/>
<circle cx="365" cy="430" r="4" fill="black"/>
<!-- windows -->
<rect x="250" y="300" width="50" height="50"/>
<line x1="275" y1="300" x2="275" y2="350"/>
<line x1="250" y1="325" x2="300" y2="325"/>
<rect x="400" y="300" width="50" height="50"/>
<line x1="425" y1="300" x2="425" y2="350"/>
<line x1="400" y1="325" x2="450" y2="325"/>
<!-- sun -->
<circle cx="680" cy="100" r="40"/>
<line x1="680" y1="30" x2="680" y2="10"/>
<line x1="680" y1="170" x2="680" y2="190"/>
<line x1="610" y1="100" x2="590" y2="100"/>
<line x1="750" y1="100" x2="770" y2="100"/>
<line x1="630" y1="50" x2="615" y2="35"/>
<line x1="730" y1="50" x2="745" y2="35"/>
<!-- tree -->
<rect x="90" y="380" width="20" height="100"/>
<circle cx="100" cy="350" r="60"/>
<!-- flowers -->
<circle cx="550" cy="470" r="10"/>
<circle cx="580" cy="475" r="10"/>
<circle cx="610" cy="470" r="10"/>
<line x1="550" y1="480" x2="550" y2="500"/>
<line x1="580" y1="485" x2="580" y2="500"/>
<line x1="610" y1="480" x2="610" y2="500"/>
<!-- fence -->
<line x1="500" y1="480" x2="500" y2="440"/>
<line x1="520" y1="480" x2="520" y2="440"/>
<line x1="540" y1="480" x2="540" y2="440"/>
<line x1="500" y1="450" x2="540" y2="450"/>
<!-- cat -->
<ellipse cx="150" cy="460" rx="30" ry="18"/>
<circle cx="120" cy="440" r="14"/>
<path d="M170 445 Q190 430 185 460"/>
<!-- clouds -->
<circle cx="180" cy="80" r="20"/>
<circle cx="205" cy="70" r="25"/>
<circle cx="235" cy="80" r="20"/>
