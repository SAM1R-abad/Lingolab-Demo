<line x1="400" y1="200" x2="560" y2="200"/>
<line x1="450" y1="200" x2="450" y2="360"/>
<line x1="510" y1="200" x2="510" y2="360"/>
<line x1="450" y1="360" x2="510" y2="360"/>
<!-- child on swing -->
